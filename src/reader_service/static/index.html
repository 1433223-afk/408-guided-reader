<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>408 Guided Reader</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="library-home" class="library-home" aria-label="Book library">
      <header class="home-toolbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">408</div>
          <div><strong>Guided Reader</strong><span>The PDF stays the book.</span></div>
        </div>
        <label class="import-button" for="import-input">Import PDF</label>
        <input id="import-input" type="file" accept="application/pdf,.pdf" hidden>
      </header>
      <main class="home-content">
        <div class="home-intro">
          <p class="eyebrow">Original pages. Nothing rewritten.</p>
          <h1>Your library</h1>
          <p>Choose a textbook to continue from where you left off.</p>
        </div>
        <section class="library-shelf">
          <div class="library-heading"><span>Books</span><span id="book-count">0</span></div>
          <div id="book-list" class="book-list"></div>
          <div id="library-empty" class="library-empty">
            <p>No books yet.</p>
            <label class="primary-action" for="import-input">Choose a PDF</label>
          </div>
        </section>
        <p class="local-note">Stored privately on this computer</p>
      </main>
    </section>

    <section id="reader" class="reader" hidden>
      <header class="toolbar">
        <div class="book-heading">
          <button id="back-to-library" class="back-button" type="button">← Library</button>
          <div><span class="eyebrow">Now reading</span><h1 id="reader-title"></h1></div>
        </div>
        <div class="reader-controls" aria-label="Reader controls">
          <button id="previous-page" class="icon-button" aria-label="Previous page">←</button>
          <label class="page-control"><span class="sr-only">PDF page</span><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ 1</span></label>
          <button id="next-page" class="icon-button" aria-label="Next page">→</button>
          <span class="control-divider"></span>
          <output id="preparation-status" class="preparation-status">Preparing text…</output>
          <button id="marks-toggle" class="marks-toggle" type="button" aria-expanded="false" aria-label="Marks on this page" title="Marks on this page"><span aria-hidden="true">✦</span><span id="marks-count" class="marks-count" hidden>0</span></button>
          <span class="control-divider"></span>
          <button id="zoom-out" class="icon-button" aria-label="Zoom out">−</button>
          <output id="zoom-value">100%</output>
          <button id="zoom-in" class="icon-button" aria-label="Zoom in">＋</button>
        </div>
      </header>
      <div id="viewer" class="viewer" tabindex="0" aria-label="PDF pages">
        <div id="pages" class="pages"></div>
      </div>
      <aside id="marks-panel" class="marks-panel" aria-label="Marks on current page" hidden>
        <div class="marks-panel-heading"><strong>Marks on page <span id="marks-page">1</span></strong><button id="marks-close" type="button" aria-label="Close marks panel">×</button></div>
        <div id="marks-list" class="marks-list"></div>
        <p id="marks-empty" class="marks-empty">No marks on this page.</p>
      </aside>
    </section>
    <div id="selection-actions" class="selection-actions" role="toolbar" aria-label="Selection actions" hidden>
      <div class="selection-action-row">
        <button id="copy-selection" type="button">Copy</button>
        <button id="save-highlight" type="button">Highlight</button>
        <button id="add-note" type="button" aria-expanded="false">Add note</button>
        <button id="cancel-selection" class="cancel-selection" type="button" aria-label="Dismiss selection actions">×</button>
      </div>
      <fieldset class="highlight-styles">
        <legend>Highlight style</legend>
        <label title="Yellow"><input type="radio" name="highlight-style" value="YELLOW" checked><span class="style-swatch yellow" aria-hidden="true"></span><span class="sr-only">Yellow</span></label>
        <label title="Green"><input type="radio" name="highlight-style" value="GREEN"><span class="style-swatch green" aria-hidden="true"></span><span class="sr-only">Green</span></label>
        <label title="Blue"><input type="radio" name="highlight-style" value="BLUE"><span class="style-swatch blue" aria-hidden="true"></span><span class="sr-only">Blue</span></label>
        <label title="No visible highlight"><input type="radio" name="highlight-style" value="NONE"><span class="style-swatch none" aria-hidden="true">×</span><span class="sr-only">No visible highlight</span></label>
      </fieldset>
      <form id="note-editor" class="note-editor" hidden>
        <label class="sr-only" for="annotation-note">Short note</label>
        <input id="annotation-note" type="text" maxlength="1000" required placeholder="Add a short note…">
        <button id="save-note" type="submit">Save note</button>
      </form>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
