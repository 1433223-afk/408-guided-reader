<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>408 Guided Reader</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <section id="library-home" class="library-home" aria-label="书库">
      <header class="home-toolbar">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">408</div>
          <div><strong>Guided Reader</strong><span>始终阅读原始 PDF。</span></div>
        </div>
        <label class="import-button" for="import-input">导入 PDF</label>
        <input id="import-input" type="file" accept="application/pdf,.pdf" hidden>
      </header>
      <main class="home-content">
        <div class="home-intro">
          <p class="eyebrow">原始页面，不重构教材。</p>
          <h1>我的书库</h1>
          <p>选择教材，从上次读到的位置继续。</p>
        </div>
        <section class="library-shelf">
          <div class="library-heading"><span>教材</span><span id="book-count">0</span></div>
          <div id="book-list" class="book-list"></div>
          <div id="library-empty" class="library-empty">
            <p>还没有教材。</p>
            <label class="primary-action" for="import-input">选择 PDF</label>
          </div>
        </section>
        <p class="local-note">仅保存在这台电脑上</p>
      </main>
    </section>

    <section id="reader" class="reader" hidden>
      <header class="toolbar">
        <div class="book-heading">
          <button id="back-to-library" class="back-button" type="button">← 书库</button>
          <div><span class="eyebrow">正在阅读</span><h1 id="reader-title"></h1></div>
        </div>
        <div class="reader-controls" aria-label="阅读器控制">
          <button id="previous-page" class="icon-button" aria-label="上一页">←</button>
          <label class="page-control"><span class="sr-only">PDF 页码</span><input id="page-number" type="number" min="1" value="1"><span id="page-total">/ 1</span></label>
          <button id="next-page" class="icon-button" aria-label="下一页">→</button>
          <span class="control-divider"></span>
          <output id="preparation-status" class="preparation-status">正在准备文字…</output>
          <button id="search-toggle" class="marks-toggle" type="button" aria-expanded="false" aria-label="书内搜索" title="书内搜索">⌕</button>
          <button id="marks-toggle" class="marks-toggle" type="button" aria-expanded="false" aria-label="本页标记" title="本页标记"><span aria-hidden="true">✦</span><span id="marks-count" class="marks-count" hidden>0</span></button>
          <span class="control-divider"></span>
          <button id="zoom-out" class="icon-button" aria-label="缩小">−</button>
          <output id="zoom-value">100%</output>
          <button id="zoom-in" class="icon-button" aria-label="放大">＋</button>
        </div>
      </header>
      <div id="viewer" class="viewer" tabindex="0" aria-label="PDF 页面">
        <div id="pages" class="pages"></div>
      </div>
      <aside id="search-panel" class="search-panel" aria-label="书内搜索" hidden>
        <div class="marks-panel-heading"><strong>书内搜索</strong><button id="search-close" type="button" aria-label="关闭书内搜索">×</button></div>
        <form id="search-form" class="search-form"><input id="search-query" type="search" maxlength="120" placeholder="搜索总线、中断向量……" aria-label="搜索本书"><button type="submit">搜索</button></form>
        <p id="search-coverage" class="search-coverage">正在读取搜索范围…</p>
        <div id="search-results" class="search-results"></div>
        <p id="search-empty" class="marks-empty">输入关键词以搜索已准备页面。</p>
      </aside>
      <aside id="marks-panel" class="marks-panel" aria-label="当前页标记" hidden>
        <div class="marks-panel-heading"><strong>第 <span id="marks-page">1</span> 页的标记</strong><button id="marks-close" type="button" aria-label="关闭标记面板">×</button></div>
        <div id="marks-list" class="marks-list"></div>
        <p id="marks-empty" class="marks-empty">本页没有标记。</p>
      </aside>
    </section>
    <div id="selection-actions" class="selection-actions" role="toolbar" aria-label="选区操作" hidden>
      <div class="selection-action-row">
        <button id="copy-selection" type="button">复制</button>
        <button id="save-highlight" type="button">高亮</button>
        <button id="add-note" type="button" aria-expanded="false">添加笔记</button>
        <button id="cancel-selection" class="cancel-selection" type="button" aria-label="关闭选区操作">×</button>
      </div>
      <fieldset class="highlight-styles">
        <legend>高亮样式</legend>
        <label title="黄色"><input type="radio" name="highlight-style" value="YELLOW" checked><span class="style-swatch yellow" aria-hidden="true"></span><span class="sr-only">黄色</span></label>
        <label title="绿色"><input type="radio" name="highlight-style" value="GREEN"><span class="style-swatch green" aria-hidden="true"></span><span class="sr-only">绿色</span></label>
        <label title="蓝色"><input type="radio" name="highlight-style" value="BLUE"><span class="style-swatch blue" aria-hidden="true"></span><span class="sr-only">蓝色</span></label>
        <label title="无可见高亮"><input type="radio" name="highlight-style" value="NONE"><span class="style-swatch none" aria-hidden="true">×</span><span class="sr-only">无可见高亮</span></label>
      </fieldset>
      <form id="note-editor" class="note-editor" hidden>
        <label class="sr-only" for="annotation-note">短笔记</label>
        <input id="annotation-note" type="text" maxlength="1000" required placeholder="添加一条短笔记……">
        <button id="save-note" type="submit">保存笔记</button>
      </form>
    </div>
    <div id="status" class="status" role="status" aria-live="polite"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
